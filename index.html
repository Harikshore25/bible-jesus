<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Verses JS</title><style>body{background:#0f172a;color:white;font-family:sans-serif;padding:15px;text-align:center}.card{background:white;color:black;border-radius:15px;padding:20px;margin:15px auto;max-width:500px}button{padding:10px 15px;margin:5px;border-radius:10px;border:none;font-weight:bold} .b{ background:#1e3a8a;color:white }</style></head><body><h1>✝️ Bible Verses JS</h1><div class="card"><h2 id="v">For God so loved the world - John 3:16</h2><p id="r">John 3:16</p><button class="b" onclick="nextV()">NEXT ➡️</button><button onclick="copyV()">COPY</button><button onclick="shareV()">SHARE</button></div><div class="card"><h3>📜 History</h3><p>God -> Moses -> David -> Jesus born & rose for us</p></div><script>const verses=[{t:"For God so loved the world - John 3:16",r:"John 3:16"},{t:"The Lord is my shepherd - Psalm 23:1",r:"Psalm 23:1"},{t:"கர்த்தர் என் மேய்ப்பர் - சங்கீதம் 23:1",r:"Psalm 23:1"},{t:"I can do all through Christ - Phil 4:13",r:"Phil 4:13"}];let i=0;function nextV(){i=(i+1)%verses.length;document.getElementById('v').innerText=verses[i].t;document.getElementById('r').innerText=verses[i].r}function copyV(){navigator.clipboard.writeText(verses[i].t);alert('Copied MG!')}function shareV(){navigator.share?navigator.share({text:verses[i].t}):copyV()}</script></body></html>
